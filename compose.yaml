services:
  database:
    image: timescale/timescaledb:latest-pg17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: folio
    volumes:
      - folio_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  folio_database:
